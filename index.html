<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Lock zooming and scaling for Kiosk mode, optimized for tablet landscape -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Event Photobooth</title>
    
    <!-- Load Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* Strict Kiosk Styling */
        * { user-select: none; touch-action: none; box-sizing: border-box; }
        body { background-color: #000; color: #fff; overflow: hidden; font-family: system-ui, sans-serif; }
        .hidden-screen { display: none !important; }
        
        /* Mirror front camera, but keep external cameras normal */
        .mirror-feed { transform: scaleX(-1); }
        
        /* Flash animation */
        @keyframes flashAnim {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
        .flash-active { animation: flashAnim 1s ease-out; }
    </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-center relative">

    <!-- HOME SCREEN -->
    <div id="screen-home" class="w-full h-full flex flex-col items-center justify-center relative">
        <h1 class="text-6xl font-bold tracking-widest mb-4">OUR SPECIAL EVENT</h1>
        <p class="text-2xl text-gray-400 mb-16">TOUCH A MODE TO START</p>
        
        <div class="flex gap-16">
            <button onclick="startSession(1)" class="w-72 h-80 bg-zinc-900 border-4 border-zinc-700 rounded-3xl flex flex-col items-center justify-center active:bg-zinc-800 active:border-blue-500 transition-all cursor-pointer shadow-xl hover:scale-105">
                <span class="text-8xl font-black text-blue-500 mb-4">1</span>
                <span class="text-2xl font-bold tracking-wide">SINGLE PHOTO</span>
            </button>
            <button onclick="startSession(4)" class="w-72 h-80 bg-zinc-900 border-4 border-zinc-700 rounded-3xl flex flex-col items-center justify-center active:bg-zinc-800 active:border-blue-500 transition-all cursor-pointer shadow-xl hover:scale-105">
                <span class="text-8xl font-black text-blue-500 mb-4">4</span>
                <span class="text-2xl font-bold tracking-wide">FOUR PHOTOS</span>
            </button>
        </div>
    </div>

    <!-- CAMERA SCREEN -->
    <div id="screen-camera" class="w-full h-full relative hidden-screen bg-black">
        <video id="camera-feed" class="w-full h-full object-cover mirror-feed" autoplay playsinline></video>
        
        <!-- Back to Home Button (Top Left) -->
        <button onclick="returnToHome()" id="camera-home-btn" class="absolute top-8 left-8 px-6 py-3 bg-black/60 backdrop-blur-md text-white font-bold text-xl rounded-full shadow-lg active:scale-95 transition-transform z-40 border-2 border-white/20">
            ← HOME
        </button>

        <!-- Status Indicator (Top Center) -->
        <div id="sequence-indicator" class="absolute top-10 left-1/2 -translate-x-1/2 text-4xl font-black text-white drop-shadow-[0_4px_6px_rgba(0,0,0,0.8)] hidden-screen tracking-widest bg-black/30 px-6 py-2 rounded-full z-40">
            PHOTO 1 OF 4
        </div>

        <!-- Small Countdown (Top Right Corner) -->
        <div id="countdown-display" class="absolute top-10 right-12 text-8xl font-black text-white drop-shadow-[0_4px_10px_rgba(0,0,0,0.8)] hidden-screen z-40">
            5
        </div>

        <!-- Camera Controls -->
        <div id="camera-controls" class="absolute bottom-10 left-0 w-full flex justify-center gap-8 z-40">
            <button onclick="executeCaptureSequence()" class="px-16 py-6 bg-blue-600 text-white font-bold text-3xl rounded-xl cursor-pointer shadow-[0_10px_30px_rgba(37,99,235,0.5)] active:scale-95 transition-transform border-4 border-blue-400">
                START SEQUENCE
            </button>
        </div>
    </div>

    <!-- PREVIEW SCREEN -->
    <div id="screen-preview" class="w-full h-full relative hidden-screen flex flex-col items-center justify-center">
        <!-- Back to Home Button (Top Left) -->
        <button onclick="returnToHome()" class="absolute top-8 left-8 px-6 py-3 bg-zinc-800/80 backdrop-blur-md text-white font-bold text-xl rounded-full shadow-lg active:scale-95 transition-transform z-40 border-2 border-zinc-600">
            ← DISCARD & HOME
        </button>

        <!-- The composed final image preview -->
        <img id="photo-preview" class="max-h-[75vh] max-w-[90vw] border-8 border-white shadow-2xl rounded-lg object-contain bg-white z-10" />
        
        <!-- Bottom Controls -->
        <div class="absolute bottom-10 left-0 w-full flex justify-center gap-8 z-40">
            <button onclick="showScreen('camera')" class="px-10 py-5 bg-zinc-800 text-white font-bold text-2xl rounded-xl cursor-pointer shadow-lg active:scale-95 transition-transform border-2 border-zinc-600">
                RETAKE
            </button>
            <button onclick="saveFinalPhoto()" class="px-14 py-5 bg-green-600 text-white font-bold text-2xl rounded-xl cursor-pointer shadow-[0_10px_30px_rgba(22,163,74,0.5)] active:scale-95 transition-transform border-4 border-green-400">
                SAVE & FINISH
            </button>
        </div>
    </div>

    <!-- Flash Overlay -->
    <div id="flash-overlay" class="absolute inset-0 bg-white opacity-0 pointer-events-none z-50"></div>

    <script>
        // --- UI & STATE REFERENCES ---
        const screens = {
            home: document.getElementById('screen-home'),
            camera: document.getElementById('screen-camera'),
            preview: document.getElementById('screen-preview')
        };
        const videoEl = document.getElementById('camera-feed');
        const previewEl = document.getElementById('photo-preview');
        const countdownEl = document.getElementById('countdown-display');
        const indicatorEl = document.getElementById('sequence-indicator');
        const controlsEl = document.getElementById('camera-controls');
        const cameraHomeBtn = document.getElementById('camera-home-btn');
        const flashEl = document.getElementById('flash-overlay');
        
        let currentStream = null;
        let currentMode = 1; // 1 or 4
        let capturedRawPhotos = []; // Stores individual frames
        let finalComposedDataUrl = null; // Stores the final template

        // Switches between UI screens
        function showScreen(screenId) {
            Object.values(screens).forEach(s => s.classList.add('hidden-screen'));
            screens[screenId].classList.remove('hidden-screen');
        }

        // Properly cleans up and goes back to the main menu
        function returnToHome() {
            stopCamera();
            showScreen('home');
        }

        // --- CAMERA INITIATION ---
        async function startSession(mode) {
            currentMode = mode;
            capturedRawPhotos = [];
            
            // Reset UI
            indicatorEl.classList.add('hidden-screen');
            controlsEl.classList.remove('hidden-screen');
            cameraHomeBtn.classList.remove('hidden-screen'); // Show Home button
            
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(d => d.kind === 'videoinput');
                
                let constraint = { facingMode: "user" }; 
                const externalCamera = videoDevices.find(d => 
                    d.label.toLowerCase().includes('usb') || 
                    d.label.toLowerCase().includes('uvc') ||
                    d.label.toLowerCase().includes('dji')
                );

                if (externalCamera) {
                    constraint = { deviceId: { exact: externalCamera.deviceId } };
                    videoEl.classList.remove('mirror-feed'); 
                } else {
                    videoEl.classList.add('mirror-feed'); 
                }

                currentStream = await navigator.mediaDevices.getUserMedia({
                    video: { ...constraint, width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: false
                });

                videoEl.srcObject = currentStream;
                showScreen('camera');
            } catch (err) {
                alert("Camera access denied or device missing.");
                console.error("Camera Error:", err);
            }
        }

        function stopCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
        }

        // --- SEQUENCE ENGINE ---
        async function executeCaptureSequence() {
            // Hide the controls and the Home button during the photo sequence
            controlsEl.classList.add('hidden-screen');
            cameraHomeBtn.classList.add('hidden-screen');
            
            capturedRawPhotos = [];
            
            // Show top indicator if 4 photos mode
            if (currentMode === 4) indicatorEl.classList.remove('hidden-screen');

            for (let i = 0; i < currentMode; i++) {
                indicatorEl.innerText = `PHOTO ${i + 1} OF ${currentMode}`;
                
                // Wait for countdown
                await runCountdown(5);
                
                // Flash effect
                triggerFlash();
                
                // Capture raw frame
                const frameData = captureRawFrame();
                capturedRawPhotos.push(frameData);
                
                // Short pause before next countdown (unless it's the last photo)
                if (i < currentMode - 1) {
                    await new Promise(resolve => setTimeout(resolve, 800));
                }
            }

            indicatorEl.classList.add('hidden-screen');
            
            // Generate final layout
            finalComposedDataUrl = await composeTemplate();
            previewEl.src = finalComposedDataUrl;
            showScreen('preview');
        }

        function runCountdown(seconds) {
            return new Promise(resolve => {
                countdownEl.classList.remove('hidden-screen');
                let timeLeft = seconds;
                countdownEl.innerText = timeLeft;
                
                const timer = setInterval(() => {
                    timeLeft--;
                    if (timeLeft > 0) {
                        countdownEl.innerText = timeLeft;
                    } else {
                        clearInterval(timer);
                        countdownEl.classList.add('hidden-screen');
                        resolve();
                    }
                }, 1000);
            });
        }

        function triggerFlash() {
            flashEl.classList.remove('flash-active');
            void flashEl.offsetWidth; // Trigger reflow to restart animation
            flashEl.classList.add('flash-active');
        }

        function captureRawFrame() {
            const canvas = document.createElement('canvas');
            canvas.width = videoEl.videoWidth;
            canvas.height = videoEl.videoHeight;
            const ctx = canvas.getContext('2d');
            
            if (videoEl.classList.contains('mirror-feed')) {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }
            
            ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL('image/jpeg', 0.95);
        }

        // --- TEMPLATE COMPOSITION ENGINE ---
        async function composeTemplate() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // Get actual camera resolution (usually 1920x1080)
            const w = videoEl.videoWidth || 1920;
            const h = videoEl.videoHeight || 1080;
            const padding = 60; // White border thickness
            
            // Setup canvas size based on mode
            if (currentMode === 1) {
                canvas.width = w + (padding * 2);
                canvas.height = h + (padding * 2);
            } else if (currentMode === 4) {
                // 2x2 Grid Layout
                canvas.width = (w * 2) + (padding * 3);
                canvas.height = (h * 2) + (padding * 3);
            }

            // Fill background with White
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Convert Base64 strings to drawable Image objects
            const loadedImages = await Promise.all(capturedRawPhotos.map(src => {
                return new Promise(resolve => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.src = src;
                });
            }));

            // Draw images into their template slots
            loadedImages.forEach((img, index) => {
                let x = padding;
                let y = padding;
                
                if (currentMode === 4) {
                    if (index === 1) x = (padding * 2) + w;
                    if (index === 2) y = (padding * 2) + h;
                    if (index === 3) { 
                        x = (padding * 2) + w; 
                        y = (padding * 2) + h; 
                    }
                }
                
                ctx.drawImage(img, x, y, w, h);
            });

            return canvas.toDataURL('image/jpeg', 0.95);
        }

        // --- FINAL SAVE ---
        function saveFinalPhoto() {
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            const link = document.createElement('a');
            link.href = finalComposedDataUrl;
            link.download = `photobooth_event_${timestamp}.jpg`;
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            returnToHome();
        }
    </script>
</body>
</html>
