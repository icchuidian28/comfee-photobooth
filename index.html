<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Lock zooming and scaling for Kiosk mode, optimized for tablet landscape -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Event Photobooth</title>
    
    <!-- Load Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* Strict Kiosk Styling */
        * { user-select: none; touch-action: none; box-sizing: border-box; }
        body { background-color: #000; color: #fff; overflow: hidden; font-family: system-ui, sans-serif; }
        .hidden-screen { display: none !important; }
        
        /* Mirror front camera, but keep external cameras normal */
        .mirror-feed { transform: scaleX(-1); }
        
        /* Flash animation */
        @keyframes flashAnim {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
        .flash-active { animation: flashAnim 1s ease-out; }
    </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-center relative">

    <!-- HOME SCREEN -->
    <div id="screen-home" class="w-full h-full flex flex-col items-center justify-center relative">
        <h1 class="text-6xl font-bold tracking-widest mb-4">OUR SPECIAL EVENT</h1>
        <p class="text-2xl text-gray-400 mb-12">TOUCH A MODE TO START</p>
        
        <div class="flex gap-8 justify-center flex-wrap max-w-6xl">
            <!-- 3 Photos: Grid -->
            <button onclick="startSession('3-grid')" class="w-64 h-80 bg-zinc-900 border-4 border-zinc-700 rounded-3xl flex flex-col items-center justify-center active:bg-zinc-800 active:border-blue-500 transition-all cursor-pointer shadow-xl hover:scale-105">
                <span class="text-7xl font-black text-blue-500 mb-2">3</span>
                <span class="text-xl font-bold tracking-wide text-center">3 PHOTOS<br/><span class="text-sm text-gray-400 font-normal">Grid Layout</span></span>
            </button>
            
            <!-- 4 Photos: Center Large -->
            <button onclick="startSession('4-center')" class="w-64 h-80 bg-zinc-900 border-4 border-zinc-700 rounded-3xl flex flex-col items-center justify-center active:bg-zinc-800 active:border-blue-500 transition-all cursor-pointer shadow-xl hover:scale-105">
                <span class="text-7xl font-black text-blue-500 mb-2">4</span>
                <span class="text-xl font-bold tracking-wide text-center">4 PHOTOS<br/><span class="text-sm text-gray-400 font-normal">Center Large</span></span>
            </button>

            <!-- 4 Photos: Left Large -->
            <button onclick="startSession('4-left')" class="w-64 h-80 bg-zinc-900 border-4 border-zinc-700 rounded-3xl flex flex-col items-center justify-center active:bg-zinc-800 active:border-blue-500 transition-all cursor-pointer shadow-xl hover:scale-105">
                <span class="text-7xl font-black text-blue-500 mb-2">4</span>
                <span class="text-xl font-bold tracking-wide text-center">4 PHOTOS<br/><span class="text-sm text-gray-400 font-normal">Left Large</span></span>
            </button>
        </div>
    </div>

    <!-- CAMERA SCREEN -->
    <div id="screen-camera" class="w-full h-full relative hidden-screen bg-black">
        <video id="camera-feed" class="w-full h-full object-cover mirror-feed" autoplay playsinline></video>
        
        <!-- Back to Home Button (Top Left) -->
        <button onclick="returnToHome()" id="camera-home-btn" class="absolute top-8 left-8 px-6 py-3 bg-black/60 backdrop-blur-md text-white font-bold text-xl rounded-full shadow-lg active:scale-95 transition-transform z-40 border-2 border-white/20">
            ← HOME
        </button>

        <!-- Status Indicator (Top Center) -->
        <div id="sequence-indicator" class="absolute top-10 left-1/2 -translate-x-1/2 text-4xl font-black text-white drop-shadow-[0_4px_6px_rgba(0,0,0,0.8)] hidden-screen tracking-widest bg-black/30 px-6 py-2 rounded-full z-40">
            PHOTO 1
        </div>

        <!-- Small Countdown (Top Right Corner) -->
        <div id="countdown-display" class="absolute top-10 right-12 text-8xl font-black text-white drop-shadow-[0_4px_10px_rgba(0,0,0,0.8)] hidden-screen z-40">
            5
        </div>

        <!-- Camera Controls -->
        <div id="camera-controls" class="absolute bottom-10 left-0 w-full flex justify-center gap-8 z-40">
            <button onclick="executeCaptureSequence()" class="px-16 py-6 bg-blue-600 text-white font-bold text-3xl rounded-xl cursor-pointer shadow-[0_10px_30px_rgba(37,99,235,0.5)] active:scale-95 transition-transform border-4 border-blue-400">
                START SEQUENCE
            </button>
        </div>
    </div>

    <!-- PREVIEW SCREEN -->
    <div id="screen-preview" class="w-full h-full relative hidden-screen flex flex-col items-center justify-center">
        <!-- Back to Home Button (Top Left) -->
        <button onclick="returnToHome()" class="absolute top-8 left-8 px-6 py-3 bg-zinc-800/80 backdrop-blur-md text-white font-bold text-xl rounded-full shadow-lg active:scale-95 transition-transform z-40 border-2 border-zinc-600">
            ← DISCARD & HOME
        </button>

        <!-- The composed final image preview -->
        <img id="photo-preview" class="max-h-[75vh] max-w-[90vw] border-8 border-white shadow-2xl rounded-lg object-contain bg-white z-10" />
        
        <!-- Bottom Controls -->
        <div class="absolute bottom-10 left-0 w-full flex justify-center gap-8 z-40">
            <!-- RETAKE BUTTON -->
            <button onclick="showScreen('camera'); executeCaptureSequence();" class="px-10 py-5 bg-zinc-800 text-white font-bold text-2xl rounded-xl cursor-pointer shadow-lg active:scale-95 transition-transform border-2 border-zinc-600">
                RETAKE
            </button>
            <button onclick="saveFinalPhoto()" class="px-14 py-5 bg-green-600 text-white font-bold text-2xl rounded-xl cursor-pointer shadow-[0_10px_30px_rgba(22,163,74,0.5)] active:scale-95 transition-transform border-4 border-green-400">
                SAVE & FINISH
            </button>
        </div>
    </div>

    <!-- Flash Overlay -->
    <div id="flash-overlay" class="absolute inset-0 bg-white opacity-0 pointer-events-none z-50"></div>

    <script>
        // --- LAYOUT ENGINE CONFIGURATION ---
        const LAYOUTS = {
            '3-grid': {
                mode: 3,
                width: 4020,
                height: 2340,
                slots: [
                    { x: 60, y: 60, w: 1920, h: 1080 },
                    { x: 2040, y: 60, w: 1920, h: 1080 },
                    { x: 60, y: 1200, w: 1920, h: 1080 }
                ]
            },
            '4-center': {
                mode: 4,
                width: 1920,
                height: 1280, // Standard 3:2 print ratio (e.g. 4x6 print)
                slots: [
                    { x: 448, y: 80, w: 1024, h: 576 }, // Center Top Large
                    { x: 60, y: 720, w: 560, h: 315 },  // Bottom Left
                    { x: 680, y: 720, w: 560, h: 315 }, // Bottom Middle
                    { x: 1300, y: 720, w: 560, h: 315 } // Bottom Right
                ]
            },
            '4-left': {
                mode: 4,
                width: 1920,
                height: 1280,
                slots: [
                    { x: 60, y: 80, w: 1024, h: 576 },  // Left Top Large
                    { x: 60, y: 720, w: 560, h: 315 },  // Bottom Left
                    { x: 680, y: 720, w: 560, h: 315 }, // Bottom Middle
                    { x: 1300, y: 720, w: 560, h: 315 } // Bottom Right
                ]
            }
        };

        // --- UI & STATE REFERENCES ---
        const screens = {
            home: document.getElementById('screen-home'),
            camera: document.getElementById('screen-camera'),
            preview: document.getElementById('screen-preview')
        };
        const videoEl = document.getElementById('camera-feed');
        const previewEl = document.getElementById('photo-preview');
        const countdownEl = document.getElementById('countdown-display');
        const indicatorEl = document.getElementById('sequence-indicator');
        const controlsEl = document.getElementById('camera-controls');
        const cameraHomeBtn = document.getElementById('camera-home-btn');
        const flashEl = document.getElementById('flash-overlay');
        
        let currentStream = null;
        let activeLayoutKey = '3-grid'; 
        let capturedRawPhotos = []; 
        let finalComposedDataUrl = null; 

        // Switches between UI screens
        function showScreen(screenId) {
            Object.values(screens).forEach(s => s.classList.add('hidden-screen'));
            screens[screenId].classList.remove('hidden-screen');
        }

        function returnToHome() {
            stopCamera();
            showScreen('home');
        }

        // --- CAMERA INITIATION ---
        async function startSession(layoutKey) {
            activeLayoutKey = layoutKey;
            capturedRawPhotos = [];
            
            // Reset UI
            indicatorEl.classList.add('hidden-screen');
            controlsEl.classList.remove('hidden-screen');
            cameraHomeBtn.classList.remove('hidden-screen');
            
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(d => d.kind === 'videoinput');
                
                let constraint = { facingMode: "user" }; 
                const externalCamera = videoDevices.find(d => 
                    d.label.toLowerCase().includes('usb') || 
                    d.label.toLowerCase().includes('uvc') ||
                    d.label.toLowerCase().includes('dji')
                );

                if (externalCamera) {
                    constraint = { deviceId: { exact: externalCamera.deviceId } };
                    videoEl.classList.remove('mirror-feed'); 
                } else {
                    videoEl.classList.add('mirror-feed'); 
                }

                currentStream = await navigator.mediaDevices.getUserMedia({
                    video: { ...constraint, width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: false
                });

                videoEl.srcObject = currentStream;
                showScreen('camera');
            } catch (err) {
                alert("Camera access denied or device missing.");
                console.error("Camera Error:", err);
            }
        }

        function stopCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
        }

        // --- SEQUENCE ENGINE ---
        async function executeCaptureSequence() {
            controlsEl.classList.add('hidden-screen');
            cameraHomeBtn.classList.add('hidden-screen');
            capturedRawPhotos = [];
            
            const layout = LAYOUTS[activeLayoutKey];
            indicatorEl.classList.remove('hidden-screen');

            for (let i = 0; i < layout.mode; i++) {
                indicatorEl.innerText = `PHOTO ${i + 1} OF ${layout.mode}`;
                
                await runCountdown(5);
                triggerFlash();
                
                const frameData = captureRawFrame();
                capturedRawPhotos.push(frameData);
                
                if (i < layout.mode - 1) {
                    await new Promise(resolve => setTimeout(resolve, 800));
                }
            }

            indicatorEl.classList.add('hidden-screen');
            
            // Generate final layout
            finalComposedDataUrl = await composeTemplate();
            previewEl.src = finalComposedDataUrl;
            showScreen('preview');
        }

        function runCountdown(seconds) {
            return new Promise(resolve => {
                countdownEl.classList.remove('hidden-screen');
                let timeLeft = seconds;
                countdownEl.innerText = timeLeft;
                
                const timer = setInterval(() => {
                    timeLeft--;
                    if (timeLeft > 0) {
                        countdownEl.innerText = timeLeft;
                    } else {
                        clearInterval(timer);
                        countdownEl.classList.add('hidden-screen');
                        resolve();
                    }
                }, 1000);
            });
        }

        function triggerFlash() {
            flashEl.classList.remove('flash-active');
            void flashEl.offsetWidth; 
            flashEl.classList.add('flash-active');
        }

        function captureRawFrame() {
            const canvas = document.createElement('canvas');
            canvas.width = videoEl.videoWidth;
            canvas.height = videoEl.videoHeight;
            const ctx = canvas.getContext('2d');
            
            if (videoEl.classList.contains('mirror-feed')) {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }
            
            ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL('image/jpeg', 0.95);
        }

        // --- BACKGROUND SMART LOADER ---
        function loadBackgroundImage(layoutKey) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => {
                    // Fallback to standard background.png if specific layout background doesn't exist
                    const fallbackImg = new Image();
                    fallbackImg.onload = () => resolve(fallbackImg);
                    fallbackImg.onerror = () => resolve(null);
                    fallbackImg.src = 'background.png';
                };
                img.src = `background-${layoutKey}.png`; // Tries e.g. background-4-center.png first
            });
        }

        // --- DYNAMIC COMPOSITION ENGINE ---
        async function composeTemplate() {
            const layout = LAYOUTS[activeLayoutKey];
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // Set canvas size from layout configuration
            canvas.width = layout.width;
            canvas.height = layout.height;

            // 1. Draw the Background
            const bgImage = await loadBackgroundImage(activeLayoutKey);
            if (bgImage) {
                ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // 2. Load and Draw the Captured Photos into their designated slots
            const loadedImages = await Promise.all(capturedRawPhotos.map(src => {
                return new Promise(resolve => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.src = src;
                });
            }));

            loadedImages.forEach((img, index) => {
                const slot = layout.slots[index];
                if(slot) {
                    ctx.drawImage(img, slot.x, slot.y, slot.w, slot.h);
                }
            });

            return canvas.toDataURL('image/jpeg', 0.95);
        }

        // --- FINAL SAVE ---
        function saveFinalPhoto() {
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            const link = document.createElement('a');
            link.href = finalComposedDataUrl;
            link.download = `photobooth_event_${timestamp}.jpg`;
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            returnToHome();
        }
    </script>
</body>
</html>
